# ==============================================================================
#                       MODERN TMUX CONFIGURATION (~/.tmux.conf)
# ==============================================================================
# Terminal base: Truecolor & Ergonomic Vim-like keybindings

# ------------------------------------------------------------------------------
# 1. GENERAL & TERMINAL SETTINGS
# ------------------------------------------------------------------------------
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"
set -s escape-time 0
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 5
set -g focus-events on
set -g mouse on

# Start window and pane numbering at 1 (more natural with keyboard numbers)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ------------------------------------------------------------------------------
# 2. ERGONOMIC SPLITS & NAVIGATION (ZERO TOUCHPAD)
# ------------------------------------------------------------------------------
# Create splits in current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Seamless Vim-Tmux navigation (Ctrl + h/j/k/l jumps across Vim splits AND Tmux panes)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Prefix + h/j/k/l fallback navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick pane resizing (Prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Maximize / Zoom active pane toggle (Prefix + z or Prefix + m)
bind m resize-pane -Z

# ------------------------------------------------------------------------------
# 3. FAST FLOATING SCRATCHPAD POPUPS (PRESS PREFIX + KEY)
# ------------------------------------------------------------------------------
# Prefix + a: Instant floating Antigravity CLI agent popup
bind a display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "/Users/tr/.local/bin/agy"

# Prefix + g: Instant floating Lazygit popup
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "/opt/homebrew/bin/lazygit"

# Prefix + y: Instant floating Yazi file manager popup
bind y display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "/opt/homebrew/bin/yazi"

# Prefix + b: Instant floating Btop system monitor popup
bind b display-popup -E -w 85% -h 85% "/opt/homebrew/bin/btop"

# Prefix + f / Ctrl + f: Instant Project Sessionizer (Switch projects in 1 second)
bind f display-popup -E -w 85% -h 75% "/Users/tr/.local/bin/tmux-sessionizer"
bind -n C-f display-popup -E -w 85% -h 75% "/Users/tr/.local/bin/tmux-sessionizer"

# ------------------------------------------------------------------------------
# 4. VI COPY MODE & SYSTEM CLIPBOARD (PBCOPY)
# ------------------------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel

# ------------------------------------------------------------------------------
# 5. STATUS BAR & TOKYO NIGHT AESTHETICS
# ------------------------------------------------------------------------------
set -g status-position top
set -g status-style "bg=#16161e,fg=#7aa2f7"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#1f2335,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#16161e,nobold] "
set -g status-right "#[fg=#3b4261]#[fg=#7aa2f7,bg=#3b4261] %H:%M #[fg=#7aa2f7,bg=#3b4261]#[fg=#1f2335,bg=#7aa2f7,bold] %Y-%m-%d "

setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#16161e,bg=#2ac3de,bold] #I:#W #[fg=#2ac3de,bg=#16161e,nobold]"

# ------------------------------------------------------------------------------
# 6. PLUGINS (TPM)
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'

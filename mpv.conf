# ==============================================================================
# mpv configuration - High Fidelity & Retina Playback for macOS
# ==============================================================================

# GPU & Decoding Engine (libplacebo high-quality pipeline)
profile=high-quality
vo=gpu-next
hwdec=auto-safe

# macOS Retina Display Native Scaling (prevents 1x blurry upscale)
hidpi-window-scale=yes

# High-Quality Scalers (Sharp Lanczos with debanding)
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
deband=yes

# Smooth Motion & Frame Synchronization
video-sync=display-resample
interpolation=yes
tscale=oversample

# Floating Window & Ergonomics
autofit=75%
geometry=50%:50%
keep-open=yes
cursor-autohide=1000
osd-font-size=24
osd-duration=2000
screenshot-directory=~/Desktop
screenshot-format=png
